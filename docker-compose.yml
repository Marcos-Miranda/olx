services:
  mlflow:
    image: ghcr.io/mlflow/mlflow:v3.17.2
    command: >
      mlflow server
      --host 0.0.0.0
      --port 5000
      --backend-store-uri sqlite:////mlflow/mlflow.db
      --artifacts-destination /mlflow/artifacts
      --serve-artifacts
      --allowed-hosts mlflow:5000,localhost:5001
    ports:
      - "5001:5000"
    volumes:
      - mlflow-data:/mlflow
    networks:
      - mlbox

volumes:
  mlflow-data:

networks:
  mlbox:
    name: mlbox
