[project]
name = "mlbox"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
    "docker>=7.2.0",
    "mlflow-skinny>=3.17.2",
    "numpy>=2.5.4",
    "pandas>=3.0.6",
    "pydantic>=2.14.1",
    "typer~=0.27.3",
]

[dependency-groups]
dev = [
    "mlflow>=3.17.2",
    "mypy>=2.4.0",
    "pandas-stubs>=3.0.5.260914",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "ruff>=0.17.1",
    "types-docker>=7.2.0.20261006",
]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "D1"]
# Public members need docstrings; modules, packages, magic methods and __init__ don't
ignore = ["D100", "D104", "D105", "D107"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["D"]

[tool.mypy]
warn_unused_ignores = true
warn_redundant_casts = true
disallow_untyped_defs = true
exclude = ["tests", "examples"]

[tool.coverage.run]
omit = ["*/__init__.py"]

[tool.pytest.ini_options]
addopts = [
    "--cov=src/mlbox",
    "--cov-report=term-missing",
]

[project.scripts]
mlbox = "mlbox.main:app"

[build-system]
requires = ["uv_build>=0.13.4,<0.14"]
build-backend = "uv_build"
